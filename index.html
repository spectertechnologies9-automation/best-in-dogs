<style>
/* Layout: one centred phone-width column. The logo sits on a ringed "tap point", two large
   slanted action tiles carry the priority actions, and everything else is a quiet grouped list. */
:root {
  --bg: #f6efe4;
  --surface: #fffdf9;
  --surface-2: #efe5d6;
  --ink: #1f1611;
  --muted: #6b5c4e;
  --line: #e2d5c2;
  --green: #e8a33d;        /* warm amber, from the paw mark (name kept so the template CSS still applies) */
  --green-ink: #9a5a0a;    /* amber that stays readable as text */
  --on-green: #1f1611;
  --tile-dark: #1f1611;
  --on-tile-dark: #ffffff;
  --star: #f2b01e;
  --danger: #b3261e;
  --scrim: rgba(12, 18, 10, .5);
  --shadow: 0 1px 2px rgba(60, 35, 10, .07), 0 10px 28px -12px rgba(60, 35, 10, .24);
  --display: "Avenir Next", "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, "Noto Serif", Georgia, serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.5, .5, 1);
  --r-lg: 26px;
  --r-md: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120e0a; --surface: #1c1612; --surface-2: #281f18; --ink: #f6efe4; --muted: #b3a291; --line: #35291f; --green: #f0b04a; --green-ink: #f3bd68; --on-green: #1f1611; --tile-dark: #f6efe4; --on-tile-dark: #120e0a; --danger: #ff8a80;
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0f0b; --surface: #161b14; --surface-2: #1f261c; --ink: #f0f4ec; --muted: #9aa894;
  --line: #283024; --green: #6cbd4e; --green-ink: #86d267; --on-green: #081005;
  --tile-dark: #f0f4ec; --on-tile-dark: #0c0f0b; --danger: #ff8a80;
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.page {
  max-width: 460px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  display: flex; flex-direction: column; gap: 22px;
}

/* ── Hero ─────────────────────────────────────────── */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; position: relative; }
.tap { position: relative; width: 132px; height: 132px; display: grid; place-items: center; margin-bottom: 14px; }
.tap img {
  width: 112px; height: 112px; border-radius: 30px; object-fit: cover; position: relative; z-index: 1;
  box-shadow: var(--shadow); background: var(--surface-2);
  animation: logo-in .6s cubic-bezier(.2, .9, .25, 1.15) both;
}
.ring {
  position: absolute; inset: 10px; border-radius: 36px; border: 2px solid var(--green); opacity: 0;
  animation: ring 3.6s cubic-bezier(.2, .6, .3, 1) infinite;
}
.ring:nth-child(2) { animation-delay: .45s; }
.ring:nth-child(3) { animation-delay: .9s; }
@keyframes ring { 0% { transform: scale(.92); opacity: 0; } 12% { opacity: .55; } 55%, 100% { transform: scale(1.5); opacity: 0; } }
@keyframes logo-in { from { transform: scale(.82); opacity: 0; } to { transform: none; opacity: 1; } }

.welcome { font-size: 14px; color: var(--muted); margin: 0; }
.hero h1 {
  margin: 0; font: italic 900 46px/1 var(--display); letter-spacing: -.03em; text-wrap: balance;
}
.tagline { margin: 6px 0 0; font-size: 17px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg.i { width: 16px; height: 16px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.is-open { color: var(--green-ink); font-weight: 600; }
.is-open .dot { background: var(--green); }

/* Tap → Open → Connect: a real sequence, the first two steps are already done on arrival */
.steps { list-style: none; margin: 16px 0 0; padding: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li + li::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--line); margin-right: 2px; }
.steps .done { color: var(--ink); }
.steps .tick { width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; }
.steps .tick svg { width: 10px; height: 10px; stroke-width: 3.2; }
.steps .now { color: var(--green-ink); }
.steps .now .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.6); opacity: .45; } }

/* ── Priority tiles ───────────────────────────────── */
.prime { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  position: relative; overflow: hidden; min-height: 148px; padding: 16px; border-radius: var(--r-lg);
  display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  box-shadow: var(--shadow); transition: transform .16s ease;
}
.tile:active, .row:active, .chip:active, .btn:active { transform: scale(.97); }
.tile::after { /* speed streak borrowed from the logo */
  content: ""; position: absolute; right: -30px; top: -20px; width: 90px; height: 200%;
  background: currentColor; opacity: .07; transform: skewX(-18deg);
}
.tile-rate { background: var(--green); color: var(--on-green); }
.tile-wifi { background: var(--tile-dark); color: var(--on-tile-dark); }
.tile svg.i { width: 30px; height: 30px; }
.tile b { display: block; font: italic 800 21px/1.1 var(--display); letter-spacing: -.01em; }
.tile small { display: block; margin-top: 4px; font-size: 13px; opacity: .8; line-height: 1.3; }
.tile .mini-stars { display: flex; gap: 1px; }
.tile .mini-stars svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }

/* ── Grouped list ─────────────────────────────────── */
.group { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 16px;
  transition: transform .16s ease, background .16s ease;
}
.row + .row { border-top: 1px solid var(--line); }
.row .ico { width: 42px; height: 42px; border-radius: 14px; background: var(--surface-2); color: var(--green-ink); display: grid; place-items: center; flex: none; }
.row .txt { flex: 1; min-width: 0; }
.row b { display: block; font-weight: 650; font-size: 16px; }
.row small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .go { color: var(--muted); width: 18px; height: 18px; }
@media (hover: hover) { .row:hover { background: var(--surface-2); } .tile:hover { transform: translateY(-2px); } }

/* ── More ─────────────────────────────────────────── */
.more h2, .sheet h2 { font: italic 800 20px/1.15 var(--display); margin: 0; letter-spacing: -.01em; }
.more { display: flex; flex-direction: column; gap: 12px; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chip {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); min-height: 84px; padding: 12px 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 600; text-align: center; line-height: 1.2; transition: transform .16s ease;
}
.chip svg.i { color: var(--green-ink); }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 0; }

/* ── Sheet ────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; opacity: 0; transition: opacity .25s ease; display: flex; align-items: flex-end; justify-content: center; }
.scrim.on { opacity: 1; }
.sheet {
  width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 28px 28px 0 0;
  padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateY(100%); transition: transform .34s cubic-bezier(.2, .85, .25, 1);
}
.scrim.on .sheet { transform: none; }
@media (min-width: 520px) { .scrim { align-items: center; } .sheet { border-radius: 28px; } }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 6px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; margin-bottom: 8px; }
.x { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.x svg.i { width: 18px; height: 18px; }
.body { display: flex; flex-direction: column; gap: 14px; animation: body-in .3s ease both; }
@keyframes body-in { from { opacity: 0; transform: translateY(8px); } }
.body p { margin: 0; }
.lead { font-size: 17px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; }
.center { text-align: center; align-items: center; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 12px 18px;
  border-radius: 16px; font-weight: 700; font-size: 16px; background: var(--green); color: var(--on-green); transition: transform .16s ease;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .55; cursor: default; }
.textlink { color: var(--green-ink); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }

/* stars */
.stars { display: flex; justify-content: center; gap: 4px; }
.star { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 14px; }
.star svg { width: 40px; height: 40px; fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; stroke-linejoin: round; transition: fill .15s ease, transform .2s cubic-bezier(.3, 1.6, .5, 1); }
.star.lit svg { fill: var(--star); stroke: var(--star); }
.star.pop svg { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 40% { transform: scale(1.32) rotate(-8deg); } }
@media (max-width: 350px) { .star { width: 46px; height: 46px; } .star svg { width: 34px; height: 34px; } }
.heart { font-size: 40px; line-height: 1; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.f input, .f textarea, .f select {
  width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 16px; font-weight: 400;
}
.f textarea { min-height: 88px; resize: vertical; }
.f input:focus, .f textarea:focus, .f select:focus { outline: none; border-color: var(--green); }
.err { color: var(--danger); font-size: 14px; }

/* wifi */
.kv { background: var(--bg); border-radius: var(--r-md); }
.kv > div { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 8px 8px 14px; }
.kv > div + div { border-top: 1px solid var(--line); }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 650; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.kv .val { flex: 1; min-width: 0; }
.kv button { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--green-ink); flex: none; }
.kv button svg.i { width: 20px; height: 20px; }
.qr { align-self: center; background: #fff; padding: 12px; border-radius: 18px; border: 1px solid var(--line); line-height: 0; }
.qr svg { width: 184px; height: 184px; max-width: 100%; display: block; }

.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; }
.list li + li { border-top: 1px solid var(--line); }
.list small { display: block; color: var(--muted); font-size: 13px; }
.list .today { font-weight: 700; color: var(--green-ink); }
.list span:last-child { text-align: right; font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translate(-50%, 20px); z-index: 20;
  background: var(--tile-dark); color: var(--on-tile-dark); padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; max-width: calc(100% - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ── Review journey ───────────────────────────────────
   Lives inside the existing sheet. Serif for the editorial voice, the page's own sans for controls,
   the logo green for confirmation only. One idea per screen, actions within thumb reach. */
.sheet.rv { display: flex; flex-direction: column; min-height: min(86vh, 700px); min-height: min(86dvh, 700px); }
.sheet.rv #sheet-body { flex: 1; display: flex; flex-direction: column; }
.sheet.rv .body { flex: 1; gap: 0; }
.sheet.rv .sheet-head { margin-bottom: 0; }
.sheet.rv #sheet-title { font: 600 11.5px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

.rv-top { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; flex: 1; padding: 8px 0 56px; }
.rv-top.sm { flex: none; gap: 0; padding: 2px 0 14px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.rv-ask { margin: 0 0 10px; font: 400 33px/1.1 var(--serif); letter-spacing: -.015em; text-align: center; text-wrap: balance; }
.rv-top.sm .rv-ask { display: none; }
.rv-cap { margin: 0; min-height: 24px; font: italic 400 17px/1.4 var(--serif); color: var(--muted); text-align: center; }
.rv-cap.swap { animation: rv-rise .4s var(--ease) both; }
.rv-top.sm .rv-cap { position: absolute; width: 1px; height: 1px; min-height: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.rv-stars { display: flex; justify-content: center; gap: 2px; }
.rv-star { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; transition: width .36s var(--ease), height .36s var(--ease); }
.rv-star svg {
  width: 42px; height: 42px; fill: transparent; stroke: var(--muted); stroke-opacity: .5; stroke-width: 1.05; stroke-linejoin: round;
  transition: fill .26s ease, stroke .26s ease, stroke-opacity .26s ease, filter .3s ease, transform .3s var(--spring), width .36s var(--ease), height .36s var(--ease);
}
.rv-star.lit svg { fill: var(--star); stroke: var(--star); stroke-opacity: 1; filter: drop-shadow(0 5px 9px rgba(242, 176, 30, .3)); }
.rv-star.pop svg { animation: rv-pop .5s var(--spring) both; animation-delay: calc(var(--i) * 42ms); }
.rv-star:active svg { transform: scale(.88); }
@media (hover: hover) { .rv-star:hover svg { transform: scale(1.08); stroke-opacity: .9; } }
.rv-top.sm .rv-star { width: 46px; height: 46px; }
.rv-top.sm .rv-star svg { width: 24px; height: 24px; filter: none; }
@keyframes rv-pop { 0% { transform: scale(.78); } 55% { transform: scale(1.16); } 100% { transform: none; } }
@keyframes rv-rise { from { opacity: 0; transform: translateY(10px); } }

.rv-stage { flex: 1; display: flex; flex-direction: column; gap: 22px; }
.rv-stage:empty { display: none; }
.rv-stage.in > *, .rv-stage.in > form > * { animation: rv-rise .52s var(--ease) both; }
.rv-stage.in > :nth-child(2), .rv-stage.in > form > :nth-child(1) { animation-delay: 60ms; }
.rv-stage.in > :nth-child(3), .rv-stage.in > form > :nth-child(2) { animation-delay: 110ms; }
.rv-stage.in > :nth-child(4), .rv-stage.in > form > :nth-child(3) { animation-delay: 160ms; }
.rv-stage.in > form > :nth-child(n+4) { animation-delay: 200ms; }

.rv-h { margin: 0; font: 400 29px/1.14 var(--serif); letter-spacing: -.012em; text-wrap: balance; }
.rv-h:focus { outline: none; }
.rv-sub { margin: 10px 0 0 !important; color: var(--muted); font-size: 15px; line-height: 1.55; text-wrap: pretty; }
.rv-eyebrow { margin: 0 0 10px !important; font: 600 11.5px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--green-ink); }

.rv-set { display: flex; flex-direction: column; gap: 12px; }
.rv-lab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0; font-size: 15px; font-weight: 650; }
.rv-lab i { flex: none; font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.rv-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.rv-tag {
  display: inline-flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 16px 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 15px; font-weight: 500; line-height: 1.2;
  transition: background .24s ease, color .24s ease, border-color .24s ease, box-shadow .24s ease, transform .24s var(--spring);
}
.rv-tag .ck { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background .24s ease, border-color .24s ease; }
.rv-tag .ck svg { width: 12px; height: 12px; fill: none; stroke: var(--on-green); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 12; stroke-dashoffset: 12; transition: stroke-dashoffset .28s var(--ease) .04s; }
.rv-tag[aria-pressed="true"] { background: var(--tile-dark); color: var(--on-tile-dark); border-color: var(--tile-dark); box-shadow: 0 8px 16px -10px rgba(60, 35, 10, .55); transform: translateY(-1px); }
.rv-tag[aria-pressed="true"] .ck { background: var(--green); border-color: var(--green); }
.rv-tag[aria-pressed="true"] .ck svg { stroke-dashoffset: 0; }
.rv-tag:active { transform: scale(.96); }
@media (hover: hover) { .rv-tag:hover { border-color: var(--muted); } }

.rv-field {
  display: block; width: 100%; min-height: 104px; padding: 14px 16px; resize: none;
  border: 1px solid var(--line); border-radius: 16px; background: var(--bg); font-size: 16px; line-height: 1.5;
  transition: border-color .2s ease, box-shadow .2s ease;
}
input.rv-field { min-height: 54px; }
.rv-field::placeholder { color: var(--muted); opacity: .75; }
.rv-field:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(232, 163, 61, .22); }

.rv-actions { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.rv-actions .textlink { align-self: center; text-align: center; min-height: 44px; display: inline-flex; align-items: center; }
.rv-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rv-row .btn { font-size: 14.5px; font-weight: 650; padding: 10px 8px; line-height: 1.2; text-align: center; }
.rv-note { margin: 0 !important; text-align: center; font-size: 13px; color: var(--muted); }

.rv-gen { flex: 1; min-height: 320px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 2px 40px; }
.rv-gen p { margin: 0; font: 400 25px/1.2 var(--serif); letter-spacing: -.01em; opacity: 0; transform: translateY(8px); transition: opacity .36s ease, transform .46s var(--ease); }
.rv-gen p.on { opacity: 1; transform: none; }
.rv-gen p.was { opacity: .32; transform: none; }
.rv-bar { height: 2px; margin-top: 14px; border-radius: 2px; background: var(--line); overflow: hidden; }
.rv-bar i { display: block; height: 100%; background: var(--green); transform: scaleX(0); transform-origin: left; transition: transform .46s var(--ease); }

.rv-card { position: relative; margin: 0; padding: 30px 22px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 22px; transition: border-color .2s ease, box-shadow .2s ease; }
.rv-card.editing { border-color: var(--green); box-shadow: 0 0 0 4px rgba(232, 163, 61, .22); }
.rv-q { display: block; height: 24px; font: 400 66px/.62 var(--serif); color: var(--green-ink); user-select: none; -webkit-user-select: none; }
.rv-text { display: block; width: 100%; margin: 0; padding: 0; border: 0; background: transparent; resize: none; font: 400 19px/1.56 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
textarea.rv-text { outline: none; overflow: hidden; }
.rv-card.sel .rv-text { user-select: all; -webkit-user-select: all; }
.rv-card figcaption { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; letter-spacing: .04em; color: var(--muted); }
.rv-mini { display: inline-flex; gap: 2px; }
.rv-mini svg { width: 14px; height: 14px; fill: var(--line); }
.rv-mini svg.on { fill: var(--star); }

.rv-end { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 12px 0 20px; }
.rv-done { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--green-ink); }
.rv-done svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: rv-draw .55s .2s var(--ease) forwards; }
@keyframes rv-draw { to { stroke-dashoffset: 0; } }
.rv-steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; }
.rv-steps li { counter-increment: s; display: flex; align-items: baseline; gap: 14px; padding: 12px 0; font-size: 15px; }
.rv-steps li + li { border-top: 1px solid var(--line); }
.rv-steps li::before { content: counter(s); flex: none; width: 14px; font: italic 400 18px/1 var(--serif); color: var(--green-ink); }

@media (max-width: 350px) {
  .rv-star { width: 52px; height: 52px; }
  .rv-star svg { width: 36px; height: 36px; }
  .rv-ask { font-size: 28px; }
  .rv-h { font-size: 26px; }
  .rv-gen p { font-size: 22px; }
  .rv-row { grid-template-columns: 1fr; }
}

.rv-top[hidden] + .rv-stage { padding-top: 16px; }
/* keep confirmations clear of the action buttons while the review sheet is open */
.scrim.on:has(.sheet.rv) ~ .toast { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 18px); }

@media (max-width: 350px) {
  .hero h1 { font-size: 40px; }
  .tile { padding: 14px; min-height: 140px; }
  .tile b { font-size: 19px; }
  .chips { gap: 8px; }
  .sheet { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rv-done svg { stroke-dashoffset: 0; }
}
</style>
</head>
<body>

<main class="page" id="app">
  <header class="hero">
    <div class="tap" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <img id="logo" alt="" width="112" height="112">
    </div>
    <p class="welcome" id="welcome"></p>
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="meta" id="meta"></div>
    <ol class="steps" aria-label="Tap, open, connect">
      <li class="done"><span class="tick"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Tap</li>
      <li class="done"><span class="tick"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Open</li>
      <li class="now"><span class="pulse"></span>Connect</li>
    </ol>
  </header>

  <section class="prime" id="prime" aria-label="Main actions"></section>
  <nav class="group" id="links" aria-label="Contact and links"></nav>
  <section class="more" id="more" aria-labelledby="more-h">
    <h2 id="more-h">More</h2>
    <div class="chips" id="chips"></div>
  </section>
  <p class="foot" id="foot"></p>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="x" type="button" data-act="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  const C = businessConfig, F = C.features || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const digits = (s) => String(s || "").replace(/[^\d]/g, "");
  const prettyUrl = (u) => String(u || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

  /* ── Icons ── */
  const P = {
    mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="M4 7.5l8 6 8-6"/>',
    paw: '<ellipse cx="12" cy="15.5" rx="4.5" ry="3.7"/><ellipse cx="5.8" cy="11" rx="1.7" ry="2.2"/><ellipse cx="9.4" cy="6.8" rx="1.7" ry="2.3"/><ellipse cx="14.6" cy="6.8" rx="1.7" ry="2.3"/><ellipse cx="18.2" cy="11" rx="1.7" ry="2.2"/>',
    star: '<path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17.1 6.6 20l1.1-6.1-4.5-4.3 6.1-.8z"/>',
    wifi: '<path d="M2.5 9.2a14 14 0 0 1 19 0M5.8 12.7a9.2 9.2 0 0 1 12.4 0M9 16.1a4.5 4.5 0 0 1 6 0"/><circle cx="12" cy="19.3" r=".9" fill="currentColor"/>',
    pin: '<path d="M12 21.5s7-6.2 7-11.6a7 7 0 1 0-14 0c0 5.400 7 11.600 7 11.600z"/><circle cx="12" cy="9.800" r="2.600"/>',
    phone: '<path d="M6.200 3.500h3l1.500 4.200-2 1.500a12 12 0 0 0 6.100 6.100l1.500-2 4.200 1.500v3a2 2 0 0 1-2.200 2A17 17 0 0 1 4.200 5.700a2 2 0 0 1 2-2.200z"/>',
    chat: '<path d="M4 19.500l1.300-4A8 8 0 1 1 8.500 18.700z"/><path d="M9.300 9.500c0 2.500 2.700 5.200 5.200 5.200"/>',
    insta: '<rect x="3.500" y="3.500" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.200" cy="6.800" r=".9" fill="currentColor"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.800 3 2.800 15 0 18M12 3c-2.800 3-2.800 15 0 18"/>',
    list: '<rect x="4.500" y="3.500" width="15" height="17" rx="3"/><path d="M8.500 8.500h7M8.500 12h7M8.500 15.500h4"/>',
    route: '<path d="M12 2.800l9.200 9.200-9.200 9.200L2.800 12z"/><path d="M9 14.500V12a1.500 1.500 0 0 1 1.500-1.500h4.500M13.200 8.200l2.300 2.300-2.300 2.300"/>',
    user: '<circle cx="12" cy="8.500" r="4"/><path d="M4.500 20.500a7.500 7.500 0 0 1 15 0"/><path d="M19 3.500v4M17 5.500h4"/>',
    gift: '<rect x="3.500" y="9" width="17" height="11.500" rx="2"/><path d="M3.500 13h17M12 9v11.500M12 9C9 9 7.500 7.800 7.500 6.300S9.500 3.500 12 9c2.500-5.500 4.500-4.200 4.500-2.700S15 9 12 9z"/>',
    heart: '<path d="M12 20.500S3.500 15.300 3.500 9.300A4.600 4.600 0 0 1 12 7a4.600 4.600 0 0 1 8.500 2.300c0 6-8.500 11.200-8.500 11.200z"/>',
    note: '<path d="M4 5.500A2 2 0 0 1 6 3.500h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-4.500 4v-4H6a2 2 0 0 1-2-2z"/><path d="M8.500 8.500h7M8.500 12h4.500"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.300l3.300 2"/>',
    share: '<circle cx="6" cy="12" r="2.600"/><circle cx="17.500" cy="5.800" r="2.600"/><circle cx="17.500" cy="18.200" r="2.600"/><path d="M8.300 10.800l6.900-3.800M8.300 13.200l6.900 3.800"/>',
    go: '<path d="M9 5.500l6.500 6.500L9 18.500"/>',
    copy: '<rect x="8.500" y="8.500" width="12" height="12" rx="2.500"/><path d="M15.500 5.500v-.5a2 2 0 0 0-2-2H5.500a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2H6"/>',
    eye: '<path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z"/><circle cx="12" cy="12" r="3"/>',
    ok: '<path d="M5 12.500l4.500 4.500L19 7.500"/>'
  };
  const icon = (n) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + P[n] + "</svg>";

  /* ── Derived links ── */
  const mapsPlace = C.mapsUrl || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.address);
  const mapsDir = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(C.address);
  const waLink = (text) => "https://wa.me/" + digits(C.whatsapp) + "?text=" + encodeURIComponent(text);

  /* ── Page render ── */
  document.title = C.name;
  $("logo").src = C.logo; $("logo").alt = C.name + " logo";
  $("welcome").textContent = C.welcome || "";
  $("name").textContent = C.name;
  $("tagline").textContent = C.tagline || "";
  $("meta").innerHTML =
    (C.location ? "<span>" + icon("pin") + esc(C.location) + "</span>" : "");

  const miniStars = '<span class="mini-stars" aria-hidden="true">' + ('<svg viewBox="0 0 24 24">' + P.star + "</svg>").repeat(5) + "</span>";
  $("prime").innerHTML =
    (F.rating ? '<button class="tile tile-rate" type="button" data-act="rate">' + miniStars + "<span><b>Rate us</b><small>Takes 10 seconds</small></span></button>" : "") +
    (F.call && C.phone ? '<a class="tile tile-wifi" href="tel:' + C.phone.replace(/[^\d+]/g, "") + '">' + icon("phone") + "<span><b>Call us</b><small>Talk to the shop</small></span></a>" : "");
  if (!(F.rating && F.call)) $("prime").style.gridTemplateColumns = "1fr";
  if (!F.rating && !F.call) $("prime").hidden = true;

  const link = (ic, title, sub, href) => '<a class="row" href="' + esc(href) + '"' + (/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : "") + '><span class="ico">' + icon(ic) + '</span><span class="txt"><b>' + esc(title) + "</b><small>" + esc(sub) + "</small></span>" + icon("go").replace('class="i"', 'class="i go"') + "</a>";
  const rowBtn = (ic, title, sub, act) => '<button class="row" type="button" data-act="' + act + '"><span class="ico">' + icon(ic) + '</span><span class="txt"><b>' + esc(title) + "</b><small>" + esc(sub) + "</small></span>" + icon("go").replace('class="i"', 'class="i go"') + "</button>";
  $("links").innerHTML = [
    F.findUs && link("pin", "Find us", C.address, mapsPlace),
    F.directions && link("route", "Get directions", "Open the route in Google Maps", mapsDir),
    F.call && C.phone && link("phone", "Call us", C.phone, "tel:" + C.phone.replace(/[^\d+]/g, "")),
    F.call && C.phone2 && link("phone", "Call us (second line)", C.phone2, "tel:" + C.phone2.replace(/[^\d+]/g, "")),
    F.whatsapp && C.whatsapp && link("chat", "WhatsApp us", "Message us directly", waLink(C.whatsappMessage || "Hi")),
    F.instagram && C.instagram && link("insta", "Instagram", "@" + prettyUrl(C.instagram).split("/").pop(), C.instagram),
    F.email && C.email && link("mail", "Email us", C.email, "mailto:" + C.email),
    F.services && rowBtn("paw", "Our services", C.menuTitle || "See what we offer", "services")
  ].filter(Boolean).join("");

  const chip = (ic, label, act) => '<button class="chip" type="button" data-act="' + act + '">' + icon(ic) + "<span>" + label + "</span></button>";
  const chips = [
    F.saveContact && chip("user", "Save contact", "vcard"),
    F.feedback && chip("note", "Feedback", "feedback"),
    F.share && chip("share", "Share profile", "share")
  ].filter(Boolean);
  $("chips").innerHTML = chips.join(""); $("chips").style.gridTemplateColumns = "repeat(" + Math.max(1, chips.length) + ", 1fr)";
  if (!chips.length) $("more").hidden = true;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + C.name;

  /* ── Toast, clipboard ── */
  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }
  async function copy(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); return true; }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove(); toast(ok ? okMsg : "Couldn't copy. Press and hold the text to copy it."); return ok;
    }
  }

  /* ── Sheet ── */
  const scrim = $("scrim"), sheet = $("sheet"); let lastFocus = null;
  function openSheet(title, html, rv) {
    sheet.classList.toggle("rv", !!rv);
    $("sheet-title").textContent = title; $("sheet-body").innerHTML = '<div class="body">' + html + "</div>";
    if (scrim.hidden) { lastFocus = document.activeElement; scrim.hidden = false; void scrim.offsetWidth; scrim.classList.add("on"); document.body.style.overflow = "hidden"; }
    sheet.scrollTop = 0; sheet.focus({ preventScroll: true });
  }
  function setBody(html) { $("sheet-body").innerHTML = '<div class="body">' + html + "</div>"; sheet.scrollTop = 0; }
  function closeSheet() {
    if (scrim.hidden) return;
    clearTimers();
    scrim.classList.remove("on"); document.body.style.overflow = "";
    setTimeout(() => { scrim.hidden = true; $("sheet-body").innerHTML = ""; }, 260);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  scrim.addEventListener("click", (e) => { if (e.target === scrim) closeSheet(); });
  document.addEventListener("keydown", (e) => {
    if (scrim.hidden) return;
    if (e.key === "Escape") closeSheet();
    if (e.key === "Tab") {  // keep focus inside the sheet
      const f = sheet.querySelectorAll("a[href],button:not([disabled]),input,textarea,select"); if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === sheet)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ── Review journey ──
     1–2 stars: private feedback.  3 stars: neutral private feedback.
     4–5 stars: keywords + optional note → review written only from those → edit / rewrite → copy → Google. */
  const RVC = C.review || {};
  const TOPICS = RVC.feedbackTopics || ["Product / Quality", "Service", "Staff", "Pricing", "Waiting time", "Availability", "Cleanliness", "Other"];
  const TAGS = RVC.keywords || ["Excellent service", "Friendly staff", "Great experience", "Great quality", "Good value", "Fast service", "Clean and welcoming", "Helpful team", "Great products", "Easy experience", "Highly recommended", "Will visit again"];
  const CAPTIONS = ["", "We can do better.", "We'd like to improve.", "Thanks for your feedback.", "We're glad you enjoyed it.", "That means a lot to us."];
  const reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  let rating = 0;
  const RV = { branch: "", tags: [], topics: [], note: "", more: "", contact: "", review: "", variant: 0, timers: [] };
  const later = (fn, ms) => { RV.timers.push(setTimeout(fn, ms)); };
  const clearTimers = () => { RV.timers.forEach(clearTimeout); RV.timers = []; };
  const resetReview = () => { clearTimers(); rating = 0; Object.assign(RV, { branch: "", tags: [], topics: [], note: "", more: "", contact: "", review: "", variant: 0 }); };

  const CHECK = '<path d="M5 12.5l4.500 4.500L19 7.500"/>';
  const starsHtml = (n) => '<div class="rv-stars" role="radiogroup" aria-label="Your rating">' + [1, 2, 3, 4, 5].map((i) =>
    '<button type="button" class="rv-star' + (i <= n ? " lit" : "") + '" style="--i:' + (i - 1) + '" role="radio" aria-checked="' + (i === n) + '" aria-label="' + i + (i === 1 ? " star" : " stars") + '" data-act="star" data-n="' + i + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + P.star + "</svg></button>").join("") + "</div>";
  const miniRating = (n) => '<span class="rv-mini" role="img" aria-label="' + n + ' stars">' + [1, 2, 3, 4, 5].map((i) => '<svg viewBox="0 0 24 24" aria-hidden="true"' + (i <= n ? ' class="on"' : "") + ">" + P.star + "</svg>").join("") + "</span>";
  const tagBtn = (t, act, list) => '<button type="button" class="rv-tag" data-act="' + act + '" data-v="' + esc(t) + '" aria-pressed="' + (list.indexOf(t) > -1) + '"><span class="ck" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 8.400l2.600 2.600L12 5.600"/></svg></span>' + esc(t) + "</button>";
  const doneMark = '<span class="rv-done" aria-hidden="true"><svg viewBox="0 0 24 24">' + CHECK + "</svg></span>";

  function setStage(html, o) {
    const st = $("rv-stage"), top = $("rv-top"); if (!st) return;
    o = o || {};
    if (top) { top.hidden = !!o.hideTop; top.classList.add("sm"); }
    st.classList.remove("in"); st.innerHTML = html; void st.offsetWidth; st.classList.add("in");
    sheet.scrollTop = 0;
    if (o.focus) { const h = st.querySelector(".rv-h"); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
  }

  function viewRate() {
    resetReview();
    openSheet(C.name + " · Your visit",
      '<div class="rv-top" id="rv-top"><h3 class="rv-ask">How was your visit?</h3>' + starsHtml(0) +
      '<p class="rv-cap" id="rv-cap" aria-live="polite">Tap a star to rate.</p></div><div class="rv-stage" id="rv-stage"></div>', true);
  }

  function onStar(n) {
    if (!$("rv-top")) return;
    rating = n; clearTimers();
    sheet.querySelectorAll(".rv-star").forEach((b, i) => {
      const on = i < n; b.classList.remove("pop"); b.classList.toggle("lit", on); b.setAttribute("aria-checked", String(i + 1 === n));
      if (on) { void b.offsetWidth; b.classList.add("pop"); }
    });
    const cap = $("rv-cap"); cap.textContent = CAPTIONS[n]; cap.classList.remove("swap"); void cap.offsetWidth; cap.classList.add("swap");
    const branch = n <= 2 ? "low" : n === 3 ? "mid" : "high";
    if (branch === RV.branch) return;                       // same route (1↔2, 4↔5): keep what the customer has entered
    const first = !RV.branch;
    later(() => { RV.branch = branch; setStage(branch === "high" ? builderStage() : feedbackStage(branch)); }, reduced ? 0 : first ? 620 : 160);
  }

  /* 1–3 stars and the "Feedback" button: private, never sent to Google */
  function feedbackStage(kind) {
    const viaWa = !(C.feedback && C.feedback.endpoint), n = esc(C.name);
    const head = kind === "low" ? ["We'd love to make this better.", "Tell us what went wrong. Your feedback goes directly to " + n + " and is not posted publicly."]
      : kind === "mid" ? ["Thanks for your feedback.", "What could have made your experience a little better?"]
      : ["Tell us anything.", "Your feedback goes directly to " + n + " and is not posted publicly."];
    const ask = kind === "low" ? "What went wrong?" : kind === "mid" ? "What could be better?" : "What is it about?";
    return '<div><h3 class="rv-h">' + head[0] + '</h3><p class="rv-sub">' + head[1] + "</p></div>" +
      '<form id="fb" novalidate style="display:contents">' +
      '<div class="rv-set" role="group" aria-labelledby="fb-what-l"><p class="rv-lab" id="fb-what-l">' + ask + '</p><div class="rv-tags">' + TOPICS.map((t) => tagBtn(t, "topic", RV.topics)).join("") + "</div></div>" +
      '<label class="rv-set" for="fb-more"><span class="rv-lab">Tell us more</span><textarea class="rv-field" id="fb-more" maxlength="1000" placeholder="' + (kind === "low" ? "What happened?" : "In your own words") + '">' + esc(RV.more) + "</textarea></label>" +
      '<label class="rv-set" for="fb-contact"><span class="rv-lab">Phone or email if you\'d like us to get back to you</span><input class="rv-field" id="fb-contact" type="text" autocomplete="tel" maxlength="120" placeholder="Optional" value="' + esc(RV.contact) + '"></label>' +
      '<p class="err" id="fb-err" role="alert" hidden></p>' +
      '<div class="rv-actions"><button class="btn" type="submit" id="fb-send">Send private feedback</button>' +
      '<p class="rv-note">' + (viaWa ? "Sent through WhatsApp, straight to " + n + "." : "Goes directly to " + n + ". Not posted publicly.") + "</p></div></form>";
  }
  function saveLocal(entry) { try { const k = "feedback:" + C.name, a = JSON.parse(localStorage.getItem(k) || "[]"); a.push(entry); localStorage.setItem(k, JSON.stringify(a)); } catch (e) {} }
  async function sendFeedback(form) {
    const what = RV.topics.join(", "), more = $("fb-more").value.trim(), contact = $("fb-contact").value.trim(), err = $("fb-err"), btn = $("fb-send");
    if (!what && !more) { err.textContent = "Choose a topic or write a few words so we know what to fix."; err.hidden = false; return; }
    err.hidden = true;
    const entry = { business: C.name, rating: rating || null, topic: what, feedback: more, contact: contact, page: location.href, time: new Date().toISOString() };
    saveLocal(entry);
    const ep = C.feedback && C.feedback.endpoint;
    if (ep) {
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const r = await fetch(ep, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry) });
        if (!r.ok) throw new Error(r.status);
        setStage('<div class="rv-end">' + doneMark + '<div><h3 class="rv-h">Thank you for telling us.</h3><p class="rv-sub">Your feedback has been received by ' + esc(C.name) + '.</p></div></div>' +
          '<div class="rv-actions"><button class="btn ghost" type="button" data-act="close">Done</button></div>', { hideTop: true, focus: true });
      } catch (e) {
        btn.disabled = false; btn.textContent = "Send private feedback";
        err.textContent = "Couldn't send. Check your connection and try again."; err.hidden = false;
      }
      return;
    }
    const msg = "Private feedback for " + C.name + (rating ? "\nRating: " + rating + "/5" : "") + (what ? "\nAbout: " + what : "") + (more ? "\n" + more : "") + (contact ? "\nContact: " + contact : "");
    setStage('<div class="rv-end"><div><h3 class="rv-h">Thank you for telling us.</h3><p class="rv-sub">One more tap to send it. WhatsApp opens with your feedback filled in. Press send there and it reaches ' + esc(C.name) + " privately.</p></div></div>" +
      '<div class="rv-actions"><a class="btn" id="fb-wa" href="' + esc(waLink(msg)) + '" target="_blank" rel="noopener">' + icon("chat") + "Open WhatsApp</a>" +
      '<button class="btn ghost" type="button" data-act="close">Done</button></div>', { hideTop: true, focus: true });
    window.location.href = waLink(msg);
  }

  /* 4–5 stars: the review builder */
  const countLabel = () => RV.tags.length ? RV.tags.length + " chosen" : "Choose any";
  function builderStage() {
    return '<div><h3 class="rv-h">That means a lot to us.</h3><p class="rv-sub">Help others discover ' + esc(C.name) + " with a quick review.</p></div>" +
      '<div class="rv-set" role="group" aria-labelledby="rv-tags-l"><p class="rv-lab" id="rv-tags-l">What stood out to you?<i id="rv-count">' + countLabel() + '</i></p><div class="rv-tags">' + TAGS.map((t) => tagBtn(t, "tag", RV.tags)).join("") + "</div></div>" +
      '<label class="rv-set" for="rv-note"><span class="rv-lab">Anything else you\'d like to say?<i>Optional</i></span><textarea class="rv-field" id="rv-note" maxlength="500" placeholder="In your own words">' + esc(RV.note) + "</textarea></label>" +
      '<div class="rv-actions"><button class="btn" type="button" data-act="rv-create">Create my review</button>' +
      '<a class="textlink" href="' + esc(C.googleReviewUrl) + '" target="_blank" rel="noopener">Or write it yourself on Google</a></div>';
  }
  function toggleTag(el, list) {
    const v = el.dataset.v, i = list.indexOf(v), on = i < 0;
    if (on) list.push(v); else list.splice(i, 1);
    el.setAttribute("aria-pressed", String(on));
    const c = $("rv-count"); if (c && list === RV.tags) c.textContent = countLabel();
    const err = $("fb-err"); if (err) err.hidden = true;
  }

  /* The writer. It can only say what the customer told it: their star rating, the keywords they
     picked and their own note, word for word. It never adds names, products, events or claims. */
  const SAY = {
    "Great quality":       ["the quality is great", "great quality", "the great quality"],
    "Good value":          ["it's good value", "good value", "the good value"],
    "Clean and welcoming": ["the place is clean and welcoming", "a clean and welcoming place", "how clean and welcoming it is"],
    "Great products":      ["the products are great", "great products", "the great products"],
    "Easy experience":     ["everything was easy", "an easy experience", "how easy everything was"]
  };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const listOf = (a, oxford) => a.length < 2 ? a.join("") : a.length === 2 ? a.join(" and ") : a.slice(0, -1).join(", ") + (oxford ? ", and " : " and ") + a[a.length - 1];
  function buildReview(v) {
    const name = C.name, t = RV.tags, has = (k) => t.indexOf(k) > -1;
    const known = (k) => SAY[k] || /^(Excellent service|Fast service|Friendly staff|Helpful team|Great experience|Highly recommended|Will visit again)$/.test(k);
    if (t.some((k) => !known(k))) v = 1;                    // custom keywords are quoted as written, never rephrased
    const items = [], seen = {};
    t.forEach((k) => {
      if (k === "Excellent service" || k === "Fast service") {
        if (seen.service) return; seen.service = 1;
        const a = listOf([has("Excellent service") && "excellent", has("Fast service") && "fast"].filter(Boolean));
        items.push(["the service was " + a, a + " service", "the " + a + " service"]);
      } else if (k === "Friendly staff" || k === "Helpful team") {
        if (seen.staff) return; seen.staff = 1;
        const f = has("Friendly staff"), h = has("Helpful team");
        items.push(f && h ? ["the staff were friendly and helpful", "friendly and helpful staff", "the friendly and helpful staff"]
          : f ? ["the staff were friendly", "friendly staff", "the friendly staff"] : ["the team was helpful", "a helpful team", "the helpful team"]);
      } else if (SAY[k]) items.push(SAY[k]);
      else if (!known(k)) { const s = k.charAt(0).toLowerCase() + k.slice(1); items.push([s, s, s]); }
    });
    const stars = rating === 5 ? "five" : "four";
    const out = [has("Great experience")
      ? ["Great experience at " + name + ".", "Had a great experience at " + name + ".", "A great experience at " + name + "."][v]
      : [(rating === 5 ? "Really happy with " : "Happy with ") + name + ".", name + " gets " + stars + " stars from me.", cap(stars) + " stars for " + name + "."][v]];
    const part = items.map((x) => x[v]);
    for (let i = 0; i < part.length; i += 3) {
      const g = part.slice(i, i + 3);
      out.push(v === 0 ? cap(listOf(g, true)) + "."
        : v === 1 ? cap(listOf(g)) + (i ? " too." : ".")
        : (i ? "Same goes for " : "I liked ") + listOf(g) + ".");
    }
    const note = RV.note.replace(/\s+/g, " ").trim();
    if (note) out.push(cap(note) + (/[.!?…]$/.test(note) ? "" : "."));
    const rec = has("Highly recommended"), again = has("Will visit again");
    if (rec && again) out.push(["Highly recommended, and I'll be back.", "I'd highly recommend " + name + " and will visit again.", "Highly recommend it. Will visit again."][v]);
    else if (rec) out.push(["Highly recommended.", "I'd highly recommend " + name + ".", "Highly recommend it."][v]);
    else if (again) out.push(["Will visit again.", "I'll be back.", "I'll be visiting again."][v]);
    return out.join(" ");
  }

  function createReview(another) {
    const n = $("rv-note"); if (n) RV.note = n.value;
    if (another) RV.variant = (RV.variant + 1) % 3;
    RV.review = buildReview(RV.variant);
    clearTimers();
    const lines = ["Understanding your experience…", "Finding the right words…", "Polishing your review…"], step = reduced ? 120 : 430;
    setStage('<div class="rv-gen" role="status">' + lines.map((l) => "<p>" + l + "</p>").join("") + '<div class="rv-bar" aria-hidden="true"><i></i></div></div>', { hideTop: true });
    const ps = sheet.querySelectorAll(".rv-gen p"), bar = sheet.querySelector(".rv-bar i");
    lines.forEach((l, i) => later(() => {
      ps.forEach((p, j) => { p.classList.toggle("on", j === i); p.classList.toggle("was", j < i); });
      bar.style.transform = "scaleX(" + (i + 1) / 3 + ")";
    }, 40 + i * step));
    later(showResult, 40 + 3 * step);
  }
  function showResult() {
    setStage('<div><p class="rv-eyebrow">Your review is ready.</p><h3 class="rv-h">Your words, polished.</h3></div>' +
      '<figure class="rv-card" id="rv-card"><span class="rv-q" aria-hidden="true">“</span><p class="rv-text" id="rv-text">' + esc(RV.review) + "</p>" +
      "<figcaption>" + miniRating(rating) + "<span>Only what you told us</span></figcaption></figure>" +
      '<div class="rv-actions"><button class="btn" type="button" data-act="rv-go">' + icon("copy") + "Copy &amp; Continue to Google</button>" +
      '<div class="rv-row"><button class="btn ghost" type="button" data-act="rv-edit" id="rv-edit-btn">Edit review</button><button class="btn ghost" type="button" data-act="rv-again">Write a different one</button></div>' +
      '<button class="textlink" type="button" data-act="rv-back">Change what I picked</button></div>', { hideTop: true, focus: true });
  }
  const grow = (ta) => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
  function toggleEdit() {
    const card = $("rv-card"), btn = $("rv-edit-btn"), el = $("rv-text"); if (!el) return;
    if (el.tagName === "TEXTAREA") {
      RV.review = el.value.trim();
      const p = document.createElement("p"); p.className = "rv-text"; p.id = "rv-text"; p.textContent = RV.review;
      el.replaceWith(p); card.classList.remove("editing"); btn.textContent = "Edit review";
    } else {
      const ta = document.createElement("textarea"); ta.className = "rv-text"; ta.id = "rv-text"; ta.maxLength = 1500; ta.rows = 1;
      ta.setAttribute("aria-label", "Your review"); ta.value = RV.review;
      el.replaceWith(ta); card.classList.add("editing"); btn.textContent = "Done editing";
      grow(ta); ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }
  /* Copy first, then open Google in the same tap so mobile browsers allow both. */
  function goGoogle() {
    const el = $("rv-text"); if (el && el.tagName === "TEXTAREA") RV.review = el.value;
    const text = RV.review.trim();
    const copied = text ? copy(text, "Review copied.") : Promise.resolve(false);
    let opened = false;
    try { const w = window.open(C.googleReviewUrl, "_blank"); if (w) { opened = true; try { w.opener = null; } catch (e) {} } } catch (e) {}
    copied.then((ok) => handoff(ok, opened, text));
  }
  function handoff(ok, opened, text) {
    const head = !text ? ["Over to Google.", "Write your review there in your own words."]
      : ok ? ["Review copied.", "Your review has been copied. Paste it into Google."]
      : ["One more step.", "We couldn't copy it automatically. Press and hold the text below to copy it, then paste it into Google."];
    setStage('<div class="rv-end">' + (ok ? doneMark : "") + '<div><h3 class="rv-h">' + head[0] + '</h3><p class="rv-sub">' + head[1] + "</p></div>" +
      (text ? '<ol class="rv-steps"><li>Choose your stars on Google</li><li>Press and hold the text box, then tap Paste</li><li>Tap Post</li></ol>' : "") +
      (text && !ok ? '<figure class="rv-card sel"><p class="rv-text">' + esc(text) + "</p></figure>" : "") + "</div>" +
      '<div class="rv-actions"><a class="btn" id="google-review" href="' + esc(C.googleReviewUrl) + '" target="_blank" rel="noopener">' + (opened ? "Open Google again" : "Continue to Google") + "</a>" +
      (text ? '<div class="rv-row"><button class="btn ghost" type="button" data-act="rv-copy">Copy again</button><button class="btn ghost" type="button" data-act="rv-result">Back to review</button></div>' : "") +
      '<button class="textlink" type="button" data-act="close">Done</button></div>', { hideTop: true, focus: true });
  }
  document.addEventListener("input", (e) => {
    const el = e.target, id = el && el.id;
    if (id === "rv-note") RV.note = el.value;
    else if (id === "fb-more") RV.more = el.value;
    else if (id === "fb-contact") RV.contact = el.value;
    else if (id === "rv-text") { RV.review = el.value; grow(el); }
  });

  /* ── Contact card ── */
  const vEsc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  function vcard() {
    const L = ["BEGIN:VCARD", "VERSION:3.0", "N:;" + vEsc(C.name) + ";;;", "FN:" + vEsc(C.name), "ORG:" + vEsc(C.name)];
    if (C.phone) L.push("TEL;TYPE=WORK,VOICE:" + C.phone.replace(/[^\d+]/g, ""));
    if (C.whatsapp && digits(C.whatsapp) !== digits(C.phone)) L.push("TEL;TYPE=CELL:" + C.whatsapp.replace(/[^\d+]/g, ""));
    if (C.email) L.push("EMAIL;TYPE=WORK:" + C.email);
    if (C.website) L.push("URL:" + C.website);
    if (C.address) L.push("ADR;TYPE=WORK:;;" + vEsc(C.address) + ";;;;");
    if (C.instagram) L.push("X-SOCIALPROFILE;TYPE=instagram:" + C.instagram);
    if (C.tagline) L.push("NOTE:" + vEsc(C.tagline));
    L.push("END:VCARD"); return L.join("\r\n") + "\r\n";
  }
  function saveContact() {
    const url = URL.createObjectURL(new Blob([vcard()], { type: "text/vcard;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = C.name.replace(/[^\w-]+/g, "_") + ".vcf";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Contact card downloaded");
  }

  /* ── Other sheets ── */
  function viewServices() {
    const items = (C.services || []).map((s) => "<li><span>" + esc(s.name) + (s.note ? "<small>" + esc(s.note) + "</small>" : "") + "</span>" + (s.price ? "<span>" + esc(s.price) + "</span>" : "") + "</li>").join("");
    openSheet(C.menuTitle || "Our services", (items ? '<ul class="list">' + items + "</ul>" : '<p class="sub">Ask us in store for the full list.</p>') +
      (C.menuUrl ? '<a class="btn" href="' + esc(C.menuUrl) + '" target="_blank" rel="noopener">See full menu</a>' : "") +
      (F.whatsapp && C.whatsapp ? '<a class="btn ghost" href="' + esc(waLink("Hi " + C.name + ", do you have this in stock?")) + '" target="_blank" rel="noopener">' + icon("chat") + "Ask if it's in stock</a>" : ""));
  }
  async function share() {
    const data = { title: C.name, text: C.name + (C.tagline ? " · " + C.tagline : ""), url: location.href.split("#")[0] };
    if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    copy(data.url, "Link copied");
  }

  /* ── Actions ── */
  const acts = {
    rate: viewRate, services: viewServices,
    vcard: saveContact, share: share, close: closeSheet,
    feedback: () => { resetReview(); openSheet(C.name + " · Private feedback", '<div class="rv-stage" id="rv-stage"></div>', true); setStage(feedbackStage("open")); },
    star: (el) => onStar(+el.dataset.n),
    topic: (el) => toggleTag(el, RV.topics),
    tag: (el) => toggleTag(el, RV.tags),
    "rv-create": () => createReview(false),
    "rv-again": () => createReview(true),
    "rv-edit": toggleEdit,
    "rv-go": goGoogle,
    "rv-result": showResult,
    "rv-back": () => { clearTimers(); setStage(builderStage()); },
    "rv-copy": () => copy(RV.review.trim(), "Review copied.")
  };
  document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (el && acts[el.dataset.act]) acts[el.dataset.act](el); });
  document.addEventListener("submit", (e) => { if (e.target.id === "fb") { e.preventDefault(); sendFeedback(e.target); } });

  // Deep links for separate NFC tags: yourpage/#rate opens the rating, #services the service list.
  const fromHash = () => { const h = location.hash.slice(1); if ({ rate: 1, services: 1 }[h] && acts[h]) acts[h](); };
  fromHash(); window.addEventListener("hashchange", fromHash);
})();
</script>
</body>
</html>
